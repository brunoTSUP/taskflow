services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: taskflow_production
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: ${TASKFLOW_DATABASE_PASSWORD:?Set TASKFLOW_DATABASE_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow -d taskflow_production"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    environment:
      RAILS_ENV: production
      DATABASE_URL: postgres://taskflow:${TASKFLOW_DATABASE_PASSWORD}@db:5432/taskflow_production
      TASKFLOW_DATABASE_PASSWORD: ${TASKFLOW_DATABASE_PASSWORD}
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
    ports:
      - "3000:80"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: